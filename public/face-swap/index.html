<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Face Swap</title>
  <link rel="stylesheet" href="/tools.css" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0b1020; color: #f5f7ff; font-family: system-ui, sans-serif; }
    main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 16px; box-sizing: border-box; }
    h1, p { margin: 0; }
    p { max-width: 28rem; line-height: 1.5; }
    .open-app { padding: 14px 22px; border-radius: 14px; background: #7c5cff; color: white; text-decoration: none; font-weight: 600; }
    .open-app:focus-visible { outline: 2px solid white; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <nav class="tools-nav" aria-label="Tools">
      <a href="/face-swap/" aria-current="page">Face Swap</a>
      <a href="/extend/">Extend</a>
      <a href="/">Templates</a>
    </nav>
    <h1>Face Swap</h1>
    <p>Use a reference face and a target image to create a face swap.</p>
    <a class="open-app" href="https://huggingface.co/spaces/Simzy/face-swap-runpod">Open Face Swap</a>
    <p>This is a private app. Sign in to Hugging Face with an account that has access.</p>
  </main>
</body>
</html>
